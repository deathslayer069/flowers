<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botanical Crest — Bloom &amp; Wreath</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 44%, #1f332a 0%, #111b17 68%, #0a100d 100%);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* Master emblem scaled proportionally with viewport */
  .emblem {
    position: relative;
    width: 74em;
    height: 74em;
    font-size: min(1.22vh, 1.22vw);
    display: grid;
    place-items: center;
  }

  /* Recessed rectangular backdrop with a faint garden lattice */
  .backdrop {
    position: absolute;
    left: 8em;
    top: 8.5em;
    width: 58em;
    height: 63.5em;
    background:
      repeating-linear-gradient(45deg, rgba(212, 180, 118, 0.05) 0 0.15em, transparent 0.15em 3.2em),
      repeating-linear-gradient(-45deg, rgba(212, 180, 118, 0.05) 0 0.15em, transparent 0.15em 3.2em),
      radial-gradient(circle at 50% 55%, rgba(44, 78, 59, 0.42) 0%, rgba(14, 24, 19, 0.85) 78%, rgba(8, 14, 11, 0.95) 100%);
    box-shadow: inset 0 0.4em 2.2em rgba(0, 0, 0, 0.65);
    pointer-events: none;
  }

  /* ================= GARDEN ENTRANCE (rectangular pergola gate) ================= */
  .gate {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    filter: drop-shadow(0 0.5em 0.9em rgba(0, 0, 0, 0.5));
  }

  .post {
    position: absolute;
    top: 3em;
    bottom: 2em;
    width: 5em;
    border-radius: 0.3em;
    background: linear-gradient(90deg, #5e3a1f, #a2693a 38%, #c48750 55%, #5e3a1f);
    box-shadow: inset 0 0 0 0.14em rgba(212, 180, 118, 0.28);
    transform-origin: 50% 100%;
    animation: postUp 1.1s cubic-bezier(.2, .8, .2, 1) both;
  }

  .post.l { left: 3em; }
  .post.r { right: 3em; animation-delay: 0.12s; }

  /* plank seams */
  .post::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2) 0 0.12em, transparent 0.12em 7em);
  }

  /* stone plinth */
  .post::after {
    content: "";
    position: absolute;
    left: -0.9em;
    bottom: 0;
    width: 6.8em;
    height: 2.6em;
    border-radius: 0.3em;
    background: linear-gradient(180deg, #b9b4a6, #8d887b);
    box-shadow: inset 0 0 0 0.12em rgba(0, 0, 0, 0.18);
  }

  .lintel {
    position: absolute;
    left: 1.5em;
    right: 1.5em;
    top: 3em;
    height: 5.5em;
    border-radius: 0.3em;
    background: linear-gradient(180deg, #c48750, #a2693a 45%, #5e3a1f);
    box-shadow: inset 0 0 0 0.14em rgba(212, 180, 118, 0.3);
    transform-origin: 50% 50%;
    animation: beamIn 0.9s cubic-bezier(.2, .8, .2, 1) 0.7s both;
  }

  /* pergola rafters resting on top of the beam */
  .lintel::before {
    content: "";
    position: absolute;
    left: 1em;
    right: 1em;
    top: -2.4em;
    height: 2.4em;
    background: repeating-linear-gradient(90deg, #8a5a34 0 1.5em, transparent 1.5em 3.9em);
    border-radius: 0.3em 0.3em 0 0;
  }

  /* gold trim around the opening */
  .gate-trim {
    position: absolute;
    left: 8em;
    top: 8.5em;
    width: 58em;
    height: 63.5em;
    border: 0.14em solid rgba(212, 180, 118, 0.5);
    animation: fadeIn 0.8s ease-out 1.2s both;
  }

  /* ---------- Vines on the gate ---------- */
  .vines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .vine {
    fill: none;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: drawVine var(--vdur, 3s) linear var(--vd, 1.3s) forwards;
  }

  .vine.main  { stroke: #2f7a43; stroke-width: 0.5; }
  .vine.thin  { stroke: #2f7a43; stroke-width: 0.3; }
  .vine.hl    { stroke: #7fd18a; stroke-width: 0.12; }

  .vleaf {
    transform: scale(0);
    animation: vpop 0.6s cubic-bezier(.2, .8, .3, 1.2) var(--ld, 2s) both;
  }

  .vbud {
    transform: scale(0);
    animation: pop 0.6s cubic-bezier(.2, .8, .3, 1.2) var(--ld, 2s) both;
  }

  @keyframes vpop {
    from { transform: scale(0); }
    to   { transform: scale(var(--s, 1)); }
  }

  @keyframes drawVine {
    to { stroke-dashoffset: 0; }
  }

  /* ================= CURATED FLOWER BOUQUET ================= */
  .bouquet-clip {
    position: absolute;
    left: 8em;
    top: 8.5em;
    width: 58em;
    height: 63.5em;
    overflow: hidden;
    z-index: 2;
  }

  .bouquet {
    position: absolute;
    inset: 0;
  }

  /* Structured, symmetrical foliage bed anchoring the bouquet base */
  .foliage-bed {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 0;
    z-index: 1;
  }

  .bed-leaf {
    position: absolute;
    width: 16.5em;
    height: 7.2em;
    background: linear-gradient(160deg, #62b86f 0%, #367c49 55%, #20562f 100%);
    border-radius: 0 100% 0 100%;
    transform-origin: 0 0;
    --flip: scaleX(1);
    animation: leaf 1.5s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: var(--ld, 0.25s);
    filter: drop-shadow(0 0.28em 0.42em rgba(0, 0, 0, 0.42));
  }

  .bed-leaf.l {
    --flip: scaleX(-1);
  }

  .bed-leaf::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 18em;
    height: 0.13em;
    background: rgba(220, 255, 220, 0.32);
    transform-origin: 0 0;
    transform: rotate(23.57deg);
  }

  /* Individual flower stem & bloom */
  .flower {
    position: absolute;
    bottom: -0.5em;
    left: var(--root-x, 50%);
    width: 28em;
    height: 55em;
    margin-left: -14em;
    transform-origin: 50% 100%;
    transform: rotate(var(--tilt, 0deg)) scale(var(--scale, 1));
    z-index: var(--z, 2);
    --delay: 0s;
    --stem-h: 40em;
    --head-top: 15em;
    /* Default Rose Vivid Pink Palette */
    --c1-o: #d6004f; --c2-o: #ff2d7a; --c3-o: #ffb3d1;
    --c1-m: #b8003f; --c2-m: #f0126b; --c3-m: #ff8fbb;
    --c1-i: #96002f; --c2-i: #d60058; --c3-i: #ff5e9c;
    --bud-c1: #f0126b; --bud-c2: #ff6aa2;
  }

  /* Cohesive Botanical Color Harmonies */
  .flower.champagne {
    --c1-o: #e06a00; --c2-o: #ffa31a; --c3-o: #ffe08a;
    --c1-m: #c25200; --c2-m: #ff8c00; --c3-m: #ffd25e;
    --c1-i: #9e3d00; --c2-i: #e66f00; --c3-i: #ffbb3d;
    --bud-c1: #ff8c00; --bud-c2: #ffd25e;
  }

  .flower.blush {
    --c1-o: #d10f1f; --c2-o: #ff3b3b; --c3-o: #ffa8a0;
    --c1-m: #b00a18; --c2-m: #f01f2d; --c3-m: #ff7f78;
    --c1-i: #8c0612; --c2-i: #d1121f; --c3-i: #ff5a55;
    --bud-c1: #f01f2d; --bud-c2: #ff8a80;
  }

  .flower.plum {
    --c1-o: #7a1fb5; --c2-o: #b84dff; --c3-o: #ecc2ff;
    --c1-m: #62159a; --c2-m: #a033f0; --c3-m: #dc9bff;
    --c1-i: #480e78; --c2-i: #8420d1; --c3-i: #c675ff;
    --bud-c1: #a033f0; --bud-c2: #dc9bff;
  }

  /* ---------- Stem ---------- */
  .stem {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 1.15em;
    height: 0;
    margin-left: -0.575em;
    background: linear-gradient(90deg, #2c6339, #57a363 45%, #377544);
    border-radius: 0.6em 0.6em 0 0;
    animation: grow 2.2s ease-out var(--delay) forwards;
  }

  /* ---------- Stem Leaves ---------- */
  .leaf {
    position: absolute;
    left: 50%;
    width: 12.6em;
    height: 5.5em;
    background: linear-gradient(160deg, #68ba74 0%, #3b8450 55%, #276338 100%);
    border-radius: 0 100% 0 100%;
    transform-origin: 0 0;
    --flip: scaleX(1);
    animation: leaf 1.45s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(var(--delay) + var(--ld, 0.5s));
    filter: drop-shadow(0 0.25em 0.35em rgba(0, 0, 0, 0.35));
  }

  .leaf.l {
    --flip: scaleX(-1);
  }

  .leaf::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 13.75em;
    height: 0.12em;
    background: rgba(225, 255, 225, 0.35);
    transform-origin: 0 0;
    transform: rotate(23.58deg);
  }

  /* ---------- Flower Head ---------- */
  .head {
    position: absolute;
    left: 50%;
    top: var(--head-top);
    width: 0;
    height: 0;
    animation: rise 2.2s ease-out var(--delay) both;
  }

  .bud {
    position: absolute;
    left: -1.8em;
    top: -4.6em;
    width: 3.6em;
    height: 5.4em;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    background: linear-gradient(to top, #3f8450 0%, #4f9a5b 28%, var(--bud-c1) 55%, var(--bud-c2) 100%);
    animation: bud 1.15s ease-in calc(var(--delay) + 2.3s) both;
  }

  .petal {
    --k: 1;
    --h: calc(var(--h0) * var(--k));
    --r: calc(var(--i) * var(--step) + var(--off));
    position: absolute;
    left: calc(var(--w) / -2);
    top: calc(var(--h) * -1);
    width: var(--w);
    height: var(--h);
    transform-origin: 50% 100%;
    border-radius: 50% 50% 45% 45% / 85% 85% 15% 15%;
    background: linear-gradient(to top, var(--c1) 0%, var(--c2) 50%, var(--c3) 100%);
    filter: drop-shadow(0 0.14em 0.28em rgba(0, 0, 0, 0.32));
    animation: open 2.4s cubic-bezier(.22, .7, .2, 1) both;
    animation-delay: calc(var(--delay) + var(--d0) + var(--i) * 0.075s);
  }

  .petal:nth-child(odd) {
    --k: 0.94;
  }

  .petal:nth-child(3n) {
    --k: 0.97;
  }

  .petal::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 6%;
    width: 0.12em;
    height: 70%;
    transform: translateX(-50%);
    border-radius: 1em;
    background: linear-gradient(to top, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.28));
  }

  .outer {
    --w: 5.5em;
    --h0: 10.2em;
    --step: 30deg;
    --off: 0deg;
    --d0: 2.3s;
    --c1: var(--c1-o);
    --c2: var(--c2-o);
    --c3: var(--c3-o);
  }

  .mid {
    --w: 4.4em;
    --h0: 7.9em;
    --step: 36deg;
    --off: 18deg;
    --d0: 2.85s;
    --c1: var(--c1-m);
    --c2: var(--c2-m);
    --c3: var(--c3-m);
  }

  .inner {
    --w: 3.3em;
    --h0: 5.6em;
    --step: 45deg;
    --off: 11deg;
    --d0: 3.35s;
    --c1: var(--c1-i);
    --c2: var(--c2-i);
    --c3: var(--c3-i);
  }

  .center {
    position: absolute;
    left: -2.25em;
    top: -2.25em;
    width: 4.5em;
    height: 4.5em;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.58), transparent 40%),
      repeating-radial-gradient(circle, #c48500 0 0.24em, #f2c438 0.24em 0.48em);
    box-shadow: 0 0 0 0.28em #a87200, 0 0.28em 0.75em rgba(0, 0, 0, 0.42);
    animation: pop 0.95s ease-out calc(var(--delay) + 3.1s) both;
  }

  /* ================= KEYFRAMES ================= */
  @keyframes grow {
    to {
      height: var(--stem-h);
    }
  }

  @keyframes rise {
    from {
      top: 55em;
    }
    to {
      top: var(--head-top);
    }
  }

  @keyframes leaf {
    from {
      transform: var(--flip) rotate(calc(var(--rot) + 55deg)) scale(0);
    }
    to {
      transform: var(--flip) rotate(var(--rot)) scale(var(--s));
    }
  }

  @keyframes bud {
    0%, 60% {
      opacity: 1;
      transform: scale(1);
    }
    100% {
      opacity: 0;
      transform: scale(1.45);
    }
  }

  @keyframes open {
    0% {
      opacity: 0;
      transform: rotate(calc(var(--r) * 0.1)) scale(0.3);
    }
    15% {
      opacity: 1;
    }
    100% {
      opacity: 1;
      transform: rotate(var(--r)) scale(1);
    }
  }

  @keyframes pop {
    from {
      transform: scale(0);
    }
    to {
      transform: scale(1);
    }
  }

  @keyframes postUp {
    from { transform: scaleY(0); }
    to   { transform: scaleY(1); }
  }

  @keyframes beamIn {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01s !important;
      animation-delay: 0s !important;
    }
  }
</style>
</head>
<body>
  <div class="emblem">
    <div class="backdrop"></div>

    <!-- Curated 4-Flower Bouquet Inside the Circle -->
    <div class="bouquet-clip">
      <div class="bouquet" id="bouquet">
        <div class="foliage-bed" id="foliage-bed"></div>
      </div>
    </div>

    <!-- Rectangular garden entrance -->
    <div class="gate">
      <div class="gate-trim"></div>
      <div class="post l"></div>
      <div class="post r"></div>
      <div class="lintel"></div>
      <svg class="vines" id="vines" viewBox="0 0 74 74" aria-hidden="true">
        <defs>
          <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8be398"/>
            <stop offset="0.55" stop-color="#3fa356"/>
            <stop offset="1" stop-color="#1f6b34"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>

<script>
  const bouquet = document.getElementById('bouquet');
  const foliageBed = document.getElementById('foliage-bed');

  // 1. Symmetrical, tiered base foliage fan framing the bottom of the emblem
  const baseTiers = [
    { x: 2.0, top: -3.2,  s: 1.12, rot: -15, ld: 0.25 },
    { x: 1.4, top: -7.0,  s: 1.02, rot: -30, ld: 0.42 },
    { x: 0.8, top: -10.8, s: 0.90, rot: -45, ld: 0.58 }
  ];

  baseTiers.forEach(tier => {
    ['l', 'r'].forEach((side, idx) => {
      const leaf = document.createElement('div');
      leaf.className = `bed-leaf ${side}`;
      leaf.style.left = `${side === 'l' ? -tier.x : tier.x}em`;
      leaf.style.top = `${tier.top}em`;
      leaf.style.setProperty('--s', tier.s);
      leaf.style.setProperty('--rot', `${tier.rot}deg`);
      leaf.style.setProperty('--ld', `${(tier.ld + idx * 0.05).toFixed(2)}s`);
      foliageBed.appendChild(leaf);
    });
  });

  // 2. Balanced diamond-arc arrangement of 4 blooms with zero leaf/petal collisions
  const flowers = [
    // Left Wing Bloom (Plum)
    {
      rootX: '47.5%',
      tilt: '-19deg',
      scale: 0.84,
      stemH: '35.5em',
      headTop: '19.5em',
      theme: 'plum',
      z: 2,
      delay: '0.18s',
      leaves: [
        { side: 'l', top: '42em', s: 0.90, rot: -36, ld: '0.45s' },
        { side: 'l', top: '33em', s: 0.76, rot: -48, ld: '0.80s' }
      ]
    },
    // Right Wing Bloom (Blush)
    {
      rootX: '52.5%',
      tilt: '19deg',
      scale: 0.84,
      stemH: '51em',
      headTop: '4em',
      theme: 'blush',
      z: 2,
      delay: '0.22s',
      leaves: [
        { side: 'r', top: '42em', s: 0.90, rot: -36, ld: '0.48s' },
        { side: 'r', top: '33em', s: 0.76, rot: -48, ld: '0.83s' }
      ]
    },
    // Crown Hero Bloom (Rose)
    {
      rootX: '49.2%',
      tilt: '-5deg',
      scale: 0.98,
      stemH: '40.5em',
      headTop: '14.5em',
      theme: '',
      z: 4,
      delay: '0s',
      leaves: [
        { side: 'l', top: '34em', s: 0.82, rot: -42, ld: '0.50s' },
        { side: 'r', top: '29em', s: 0.72, rot: -50, ld: '0.78s' }
      ]
    },
    // Foreground Focal Bloom (Champagne)
    {
      rootX: '51.2%',
      tilt: '7deg',
      scale: 0.90,
      stemH: '31.5em',
      headTop: '23.5em',
      theme: 'champagne',
      z: 5,
      delay: '0.12s',
      leaves: [
        { side: 'l', top: '41em', s: 0.78, rot: -40, ld: '0.46s' },
        { side: 'r', top: '37em', s: 0.72, rot: -48, ld: '0.72s' }
      ]
    }
  ];

  const makePetals = (cls, count) => {
    const ring = document.createElement('div');
    ring.className = `ring ${cls}`;
    for (let i = 0; i < count; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.setProperty('--i', i);
      ring.appendChild(petal);
    }
    return ring;
  };

  flowers.forEach(f => {
    const el = document.createElement('div');
    el.className = f.theme ? `flower ${f.theme}` : 'flower';
    el.style.setProperty('--root-x', f.rootX);
    el.style.setProperty('--tilt', f.tilt);
    el.style.setProperty('--scale', f.scale);
    el.style.setProperty('--stem-h', f.stemH);
    el.style.setProperty('--head-top', f.headTop);
    el.style.setProperty('--z', f.z);
    el.style.setProperty('--delay', f.delay);

    const stem = document.createElement('div');
    stem.className = 'stem';
    el.appendChild(stem);

    f.leaves.forEach(lf => {
      const leaf = document.createElement('div');
      leaf.className = `leaf ${lf.side}`;
      leaf.style.top = lf.top;
      leaf.style.setProperty('--s', lf.s);
      leaf.style.setProperty('--rot', `${lf.rot}deg`);
      leaf.style.setProperty('--ld', lf.ld);
      el.appendChild(leaf);
    });

    const head = document.createElement('div');
    head.className = 'head';

    const bud = document.createElement('div');
    bud.className = 'bud';
    head.appendChild(bud);

    head.appendChild(makePetals('outer', 12));
    head.appendChild(makePetals('mid', 10));
    head.appendChild(makePetals('inner', 8));

    const center = document.createElement('div');
    center.className = 'center';
    head.appendChild(center);

    el.appendChild(head);
    bouquet.appendChild(el);
  });

  // 4. Vines climbing both gate posts and meeting across the top beam
  const svgNS = 'http://www.w3.org/2000/svg';
  const vines = document.getElementById('vines');
  const vineDefs = [
    { d: 'M5.2 71 C1.5 64 9 59 4.8 51 C1.2 44 9 39 4.8 31 C1.5 24 8.5 19 4.6 12 C3 9 4 7 6 6.5 C10 5 12 9.5 17 7 S25 3.5 29 6.5 S34 8 37 5',
      cls: 'main', start: 1.3, dur: 3.4, gap: 2.9, blossom: 5 },
    { d: 'M12 8 C10.5 11 13.5 13 11.5 17',   cls: 'thin', start: 3.6, dur: 1.0, gap: 2.2, blossom: 0 },
    { d: 'M20 7.5 C18.5 12 22 15 19.5 19',   cls: 'thin', start: 3.9, dur: 1.1, gap: 2.4, blossom: 0 },
    { d: 'M28.5 7.5 C27 11 30 13.5 28 17.5', cls: 'thin', start: 4.2, dur: 1.0, gap: 2.2, blossom: 0 }
  ];

  const mk = (tag, attrs) => {
    const e = document.createElementNS(svgNS, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    return e;
  };

  ['left', 'right'].forEach(side => {
    const g = mk('g', side === 'right' ? { transform: 'translate(74 0) scale(-1 1)' } : {});
    const sideDelay = side === 'right' ? 0.15 : 0;

    vineDefs.forEach(v => {
      const stem = mk('path', { d: v.d, pathLength: 1, class: `vine ${v.cls}` });
      stem.style.setProperty('--vd', `${v.start + sideDelay}s`);
      stem.style.setProperty('--vdur', `${v.dur}s`);
      g.appendChild(stem);

      if (v.cls === 'main') {
        const hl = mk('path', { d: v.d, pathLength: 1, class: 'vine hl' });
        hl.style.setProperty('--vd', `${v.start + sideDelay}s`);
        hl.style.setProperty('--vdur', `${v.dur}s`);
        g.appendChild(hl);
      }

      const len = stem.getTotalLength();
      const n = Math.floor(len / v.gap);
      for (let i = 1; i <= n; i++) {
        const l = (i / (n + 1)) * len;
        const p = stem.getPointAtLength(l);
        const q = stem.getPointAtLength(Math.min(l + 0.3, len));
        const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
        const dir = i % 2 ? 1 : -1;
        const size = (v.cls === 'main' ? 0.95 : 0.7) + ((i * 7) % 5) * 0.06;
        const delay = (v.start + sideDelay + v.dur * (l / len)).toFixed(2);

        const holder = mk('g', { transform: `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${(ang + dir * 55).toFixed(1)})` });
        const leaf = mk('path', { d: 'M0 0 C0.8 -1.1 2.2 -1.1 3 0 C2.2 1.1 0.8 1.1 0 0Z', fill: 'url(#leafG)', class: 'vleaf' });
        leaf.style.transformOrigin = '0 0';
        leaf.style.setProperty('--ld', `${delay}s`);
        leaf.style.setProperty('--s', size.toFixed(2));
        holder.appendChild(leaf);
        g.appendChild(holder);

        if (v.blossom && i % v.blossom === 0) {
          const bud = mk('circle', { cx: p.x.toFixed(2), cy: p.y.toFixed(2), r: 0.55, fill: '#ff3d6e', class: 'vbud' });
          bud.style.transformOrigin = `${p.x.toFixed(2)}px ${p.y.toFixed(2)}px`;
          bud.style.setProperty('--ld', `${(+delay + 0.2).toFixed(2)}s`);
          g.appendChild(bud);
        }
      }
    });

    vines.appendChild(g);
  });
</script>
