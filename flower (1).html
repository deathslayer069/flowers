<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botanical Crest — Bloom &amp; Wreath</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 44%, #1f332a 0%, #111b17 68%, #0a100d 100%);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  /* Master circular emblem scaled proportionally with viewport */
  .emblem {
    position: relative;
    width: 74em;
    height: 74em;
    font-size: min(1.22vh, 1.22vw);
    display: grid;
    place-items: center;
  }

  /* Recessed vignette backdrop & fine hair-line inner frame growing from the ground */
  .backdrop {
    position: absolute;
    width: 61.6em;
    height: 61.6em;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 55%, rgba(52, 94, 70, 0.50) 0%, rgba(14, 24, 19, 0.88) 78%, rgba(8, 14, 11, 0.96) 100%);
    box-shadow:
      inset 0 0.4em 2.2em rgba(0, 0, 0, 0.65),
      0 0 0 0.14em rgba(226, 192, 124, 0.28);
    transform-origin: 50% 100%;
    animation: growCircle 4.8s cubic-bezier(.16, .84, .28, 1) both;
    pointer-events: none;
  }

  /* ================= SURROUNDING BOTANICAL WREATH ================= */
  .wreath {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }

  .wreath svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 0.45em 0.85em rgba(0, 0, 0, 0.45));
  }

  /* Half-circle arcs drawn bilaterally from bottom (90deg) up to top (-90deg) */
  .stem-arc {
    fill: none;
    stroke-linecap: round;
    animation: drawArc 4.6s cubic-bezier(.22, .68, .24, 1) forwards;
  }

  /* Primary ring r = 42.5 -> half circumference = pi * 42.5 = 133.52 */
  .stem-arc.primary {
    stroke: #46965a;
    stroke-width: 2.15;
    stroke-dasharray: 133.6;
    stroke-dashoffset: 133.6;
    animation-delay: 0.2s;
  }

  /* Highlight ring r = 41.3 -> half circumference = pi * 41.3 = 129.75 */
  .stem-arc.highlight {
    stroke: #74cc7f;
    stroke-width: 1.3;
    stroke-dasharray: 129.8;
    stroke-dashoffset: 129.8;
    animation-delay: 0.35s;
  }

  /* Shadow ring r = 43.6 -> half circumference = pi * 43.6 = 136.97 */
  .stem-arc.shadow {
    stroke: #265c35;
    stroke-width: 1.1;
    stroke-dasharray: 137.0;
    stroke-dashoffset: 137.0;
    animation-delay: 0.5s;
  }

  /* Positioned strictly along the primary ring radius (42.5% of 74em = 31.45em) */
  .w-node {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform: rotate(var(--a, 0deg)) translateY(-31.45em);
  }

  .w-leaf {
    position: absolute;
    left: 0;
    top: 0;
    width: 7.4em;
    height: 3.1em;
    background: linear-gradient(160deg, #7ed98a 0%, #419156 55%, #246135 100%);
    border-radius: 0 100% 0 100%;
    transform-origin: 0 0;
    --dir: 1;
    animation: wLeaf 1.7s cubic-bezier(.2, .75, .25, 1) both;
    animation-delay: var(--wd, 0.4s);
    filter: drop-shadow(0 0.2em 0.32em rgba(0, 0, 0, 0.35));
  }

  .w-leaf.in {
    --dir: -1;
    background: linear-gradient(160deg, #62ba6e 0%, #317845 60%, #1c4f2b 100%);
  }

  .w-leaf::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 8.02em;
    height: 0.1em;
    background: rgba(235, 255, 235, 0.42);
    transform-origin: 0 0;
    transform: rotate(22.73deg);
  }

  /* Small golden berry accents placed at intervals around the wreath */
  .w-berry {
    position: absolute;
    left: -0.55em;
    top: -0.55em;
    width: 1.1em;
    height: 1.1em;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff0b8 0%, #eab034 58%, #9e680e 100%);
    box-shadow: 0 0.15em 0.3em rgba(0, 0, 0, 0.45);
    animation: pop 0.9s ease-out var(--bd, 1s) both;
  }

  /* ================= CURATED FLOWER BOUQUET ================= */
  .bouquet-clip {
    position: relative;
    width: 61.6em;
    height: 61.6em;
    border-radius: 50%;
    overflow: hidden;
    transform-origin: 50% 100%;
    animation: growCircle 4.8s cubic-bezier(.16, .84, .28, 1) both;
    z-index: 2;
  }

  .bouquet {
    position: absolute;
    inset: 0;
  }

  /* Structured, symmetrical foliage bed anchoring the bouquet base */
  .foliage-bed {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 0;
    z-index: 1;
  }

  .bed-leaf {
    position: absolute;
    width: 16.5em;
    height: 7.2em;
    background: linear-gradient(160deg, #6bc778 0%, #39854e 55%, #205c31 100%);
    border-radius: 0 100% 0 100%;
    transform-origin: 0 0;
    --flip: scaleX(1);
    animation: leaf 1.85s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: var(--ld, 0.4s);
    filter: drop-shadow(0 0.28em 0.42em rgba(0, 0, 0, 0.42));
  }

  .bed-leaf.l {
    --flip: scaleX(-1);
  }

  .bed-leaf::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 18em;
    height: 0.13em;
    background: rgba(225, 255, 225, 0.35);
    transform-origin: 0 0;
    transform: rotate(23.57deg);
  }

  /* Individual flower stem & bloom */
  .flower {
    position: absolute;
    bottom: -0.5em;
    left: var(--root-x, 50%);
    width: 28em;
    height: 55em;
    margin-left: -14em;
    transform-origin: 50% 100%;
    transform: rotate(var(--tilt, 0deg)) scale(var(--scale, 1));
    z-index: var(--z, 2);
    --delay: 0s;
    --stem-h: 40em;
    --head-top: 15em;
    /* Vibrant Rose Magenta-Pink Palette */
    --c1-o: #b81952; --c2-o: #ff5c98; --c3-o: #ffe0ec;
    --c1-m: #9e1043; --c2-m: #f0387c; --c3-m: #ffc2d9;
    --c1-i: #800834; --c2-i: #d41e62; --c3-i: #ff9ec2;
    --bud-c1: #f0387c; --bud-c2: #ffa8c8;
  }

  /* Vibrant Botanical Color Harmonies */
  .flower.champagne {
    --c1-o: #c45c0e; --c2-o: #ff9d2e; --c3-o: #fff0cf;
    --c1-m: #a84905; --c2-m: #f57e16; --c3-m: #ffde9e;
    --c1-i: #873600; --c2-i: #d96409; --c3-i: #ffc96e;
    --bud-c1: #f57e16; --bud-c2: #ffde9e;
  }

  .flower.blush {
    /* Rich, vivid crimson-red bloom on the right */
    --c1-o: #bd1826; --c2-o: #ff4d5c; --c3-o: #ffe0e3;
    --c1-m: #a10f1c; --c2-m: #f22e3e; --c3-m: #ffbdC2;
    --c1-i: #800711; --c2-i: #d61828; --c3-i: #ff949d;
    --bud-c1: #f22e3e; --bud-c2: #ff9ea6;
  }

  .flower.plum {
    --c1-o: #6d2496; --c2-o: #b95cf0; --c3-o: #f3e0ff;
    --c1-m: #58187d; --c2-m: #9d38db; --c3-m: #e3bfff;
    --c1-i: #400d5e; --c2-i: #8020bd; --c3-i: #cf99f2;
    --bud-c1: #9d38db; --bud-c2: #e3bfff;
  }

  /* ---------- Stem ---------- */
  .stem {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 1.15em;
    height: 0;
    margin-left: -0.575em;
    background: linear-gradient(90deg, #2b693a, #62b56e 45%, #387d47);
    border-radius: 0.6em 0.6em 0 0;
    animation: grow 3.0s ease-out var(--delay) forwards;
  }

  /* ---------- Stem Leaves ---------- */
  .leaf {
    position: absolute;
    left: 50%;
    width: 12.6em;
    height: 5.5em;
    background: linear-gradient(160deg, #72c97e 0%, #3f8f54 55%, #266939 100%);
    border-radius: 0 100% 0 100%;
    transform-origin: 0 0;
    --flip: scaleX(1);
    animation: leaf 1.75s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: calc(var(--delay) + var(--ld, 0.7s));
    filter: drop-shadow(0 0.25em 0.35em rgba(0, 0, 0, 0.35));
  }

  .leaf.l {
    --flip: scaleX(-1);
  }

  .leaf::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 13.75em;
    height: 0.12em;
    background: rgba(230, 255, 230, 0.38);
    transform-origin: 0 0;
    transform: rotate(23.58deg);
  }

  /* ---------- Flower Head ---------- */
  .head {
    position: absolute;
    left: 50%;
    top: var(--head-top);
    width: 0;
    height: 0;
    animation: rise 3.0s ease-out var(--delay) both;
  }

  .bud {
    position: absolute;
    left: -1.8em;
    top: -4.6em;
    width: 3.6em;
    height: 5.4em;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    background: linear-gradient(to top, #3f8450 0%, #55a662 26%, var(--bud-c1) 52%, var(--bud-c2) 100%);
    animation: bud 1.3s ease-in calc(var(--delay) + 3.05s) both;
  }

  .petal {
    --k: 1;
    --h: calc(var(--h0) * var(--k));
    --r: calc(var(--i) * var(--step) + var(--off));
    position: absolute;
    left: calc(var(--w) / -2);
    top: calc(var(--h) * -1);
    width: var(--w);
    height: var(--h);
    transform-origin: 50% 100%;
    border-radius: 50% 50% 45% 45% / 85% 85% 15% 15%;
    background: linear-gradient(to top, var(--c1) 0%, var(--c2) 48%, var(--c3) 100%);
    filter: drop-shadow(0 0.16em 0.34em rgba(0, 0, 0, 0.38));
    animation: open 2.7s cubic-bezier(.22, .7, .2, 1) both;
    animation-delay: calc(var(--delay) + var(--d0) + var(--i) * 0.08s);
  }

  .petal:nth-child(odd) {
    --k: 0.94;
  }

  .petal:nth-child(3n) {
    --k: 0.97;
  }

  .petal::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 6%;
    width: 0.12em;
    height: 70%;
    transform: translateX(-50%);
    border-radius: 1em;
    background: linear-gradient(to top, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.34));
  }

  .outer {
    --w: 5.5em;
    --h0: 10.2em;
    --step: 30deg;
    --off: 0deg;
    --d0: 3.1s;
    --c1: var(--c1-o);
    --c2: var(--c2-o);
    --c3: var(--c3-o);
  }

  .mid {
    --w: 4.4em;
    --h0: 7.9em;
    --step: 36deg;
    --off: 18deg;
    --d0: 3.65s;
    --c1: var(--c1-m);
    --c2: var(--c2-m);
    --c3: var(--c3-m);
  }

  .inner {
    --w: 3.3em;
    --h0: 5.6em;
    --step: 45deg;
    --off: 11deg;
    --d0: 4.2s;
    --c1: var(--c1-i);
    --c2: var(--c2-i);
    --c3: var(--c3-i);
  }

  .center {
    position: absolute;
    left: -2.25em;
    top: -2.25em;
    width: 4.5em;
    height: 4.5em;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.68), transparent 40%),
      repeating-radial-gradient(circle, #d48800 0 0.24em, #ffd23f 0.24em 0.48em);
    box-shadow: 0 0 0 0.28em #b57700, 0 0.28em 0.75em rgba(0, 0, 0, 0.45);
    animation: pop 1.05s ease-out calc(var(--delay) + 3.95s) both;
  }

  /* ================= KEYFRAMES ================= */
  @keyframes growCircle {
    0% {
      transform: scale(0);
      opacity: 0.15;
    }
    16% {
      opacity: 1;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  @keyframes grow {
    to {
      height: var(--stem-h);
    }
  }

  @keyframes rise {
    from {
      top: 55em;
    }
    to {
      top: var(--head-top);
    }
  }

  @keyframes leaf {
    from {
      transform: var(--flip) rotate(calc(var(--rot) + 55deg)) scale(0);
    }
    to {
      transform: var(--flip) rotate(var(--rot)) scale(var(--s));
    }
  }

  @keyframes bud {
    0%, 60% {
      opacity: 1;
      transform: scale(1);
    }
    100% {
      opacity: 0;
      transform: scale(1.45);
    }
  }

  @keyframes open {
    0% {
      opacity: 0;
      transform: rotate(calc(var(--r) * 0.1)) scale(0.3);
    }
    15% {
      opacity: 1;
    }
    100% {
      opacity: 1;
      transform: rotate(var(--r)) scale(1);
    }
  }

  @keyframes pop {
    from {
      transform: scale(0);
    }
    to {
      transform: scale(1);
    }
  }

  @keyframes drawArc {
    to {
      stroke-dashoffset: 0;
    }
  }

  @keyframes wLeaf {
    from {
      transform: scaleY(var(--dir)) rotate(45deg) scale(0);
    }
    to {
      transform: scaleY(var(--dir)) rotate(var(--wr, -26deg)) scale(var(--ws, 1));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01s !important;
      animation-delay: 0s !important;
    }
  }
</style>
</head>
<body>
  <div class="emblem">
    <div class="backdrop"></div>

    <!-- Curated 4-Flower Bouquet Inside the Circle -->
    <div class="bouquet-clip">
      <div class="bouquet" id="bouquet">
        <div class="foliage-bed" id="foliage-bed"></div>
      </div>
    </div>

    <!-- Bilateral Circular Stem & Leaf Wreath (grows from bottom 90deg up both sides to top -90deg) -->
    <div class="wreath" id="wreath">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <!-- Right half: sweeps from bottom (90deg) clockwise to top (270deg / -90deg) -->
        <path class="stem-arc primary"   d="M 50 92.5 A 42.5 42.5 0 0 0 50 7.5" />
        <path class="stem-arc highlight" d="M 50 91.3 A 41.3 41.3 0 0 0 50 8.7" />
        <path class="stem-arc shadow"    d="M 50 93.6 A 43.6 43.6 0 0 0 50 6.4" />

        <!-- Left half: sweeps from bottom (90deg) counter-clockwise to top (-90deg) -->
        <path class="stem-arc primary"   d="M 50 92.5 A 42.5 42.5 0 0 1 50 7.5" />
        <path class="stem-arc highlight" d="M 50 91.3 A 41.3 41.3 0 0 1 50 8.7" />
        <path class="stem-arc shadow"    d="M 50 93.6 A 43.6 43.6 0 0 1 50 6.4" />
      </svg>
    </div>
  </div>

<script>
  const bouquet = document.getElementById('bouquet');
  const foliageBed = document.getElementById('foliage-bed');

  // 1. Symmetrical, tiered base foliage fan framing the bottom of the emblem
  const baseTiers = [
    { x: 2.0, top: -3.2,  s: 1.12, rot: -15, ld: 0.55 },
    { x: 1.4, top: -7.0,  s: 1.02, rot: -30, ld: 0.80 },
    { x: 0.8, top: -10.8, s: 0.90, rot: -45, ld: 1.05 }
  ];

  baseTiers.forEach(tier => {
    ['l', 'r'].forEach((side, idx) => {
      const leaf = document.createElement('div');
      leaf.className = `bed-leaf ${side}`;
      leaf.style.left = `${side === 'l' ? -tier.x : tier.x}em`;
      leaf.style.top = `${tier.top}em`;
      leaf.style.setProperty('--s', tier.s);
      leaf.style.setProperty('--rot', `${tier.rot}deg`);
      leaf.style.setProperty('--ld', `${(tier.ld + idx * 0.08).toFixed(2)}s`);
      foliageBed.appendChild(leaf);
    });
  });

  // 2. Balanced arrangement of 4 vibrant blooms with taller right red flower
  const flowers = [
    // Left Wing Bloom (Vibrant Plum)
    {
      rootX: '47.5%',
      tilt: '-19deg',
      scale: 0.84,
      stemH: '35.5em',
      headTop: '19.5em',
      theme: 'plum',
      z: 2,
      delay: '0.80s',
      leaves: [
        { side: 'l', top: '42em', s: 0.90, rot: -36, ld: '0.70s' },
        { side: 'l', top: '33em', s: 0.76, rot: -48, ld: '1.20s' }
      ]
    },
    // Taller Right Red Bloom
    {
      rootX: '52.2%',
      tilt: '13deg',
      scale: 0.88,
      stemH: '43.5em',
      headTop: '11.5em',
      theme: 'blush',
      z: 3,
      delay: '0.65s',
      leaves: [
        { side: 'r', top: '41em', s: 0.90, rot: -36, ld: '0.70s' },
        { side: 'r', top: '28em', s: 0.78, rot: -48, ld: '1.20s' }
      ]
    },
    // Crown Hero Bloom (Vibrant Rose)
    {
      rootX: '49.0%',
      tilt: '-6deg',
      scale: 0.98,
      stemH: '40.5em',
      headTop: '14.5em',
      theme: '',
      z: 4,
      delay: '0.50s',
      leaves: [
        { side: 'l', top: '34em', s: 0.82, rot: -42, ld: '0.75s' },
        { side: 'r', top: '29em', s: 0.72, rot: -50, ld: '1.15s' }
      ]
    },
    // Foreground Focal Bloom (Vibrant Champagne Gold)
    {
      rootX: '51.2%',
      tilt: '7deg',
      scale: 0.90,
      stemH: '31.5em',
      headTop: '23.5em',
      theme: 'champagne',
      z: 5,
      delay: '0.70s',
      leaves: [
        { side: 'l', top: '41em', s: 0.78, rot: -40, ld: '0.70s' },
        { side: 'r', top: '37em', s: 0.72, rot: -48, ld: '1.10s' }
      ]
    }
  ];

  const makePetals = (cls, count) => {
    const ring = document.createElement('div');
    ring.className = `ring ${cls}`;
    for (let i = 0; i < count; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.setProperty('--i', i);
      ring.appendChild(petal);
    }
    return ring;
  };

  flowers.forEach(f => {
    const el = document.createElement('div');
    el.className = f.theme ? `flower ${f.theme}` : 'flower';
    el.style.setProperty('--root-x', f.rootX);
    el.style.setProperty('--tilt', f.tilt);
    el.style.setProperty('--scale', f.scale);
    el.style.setProperty('--stem-h', f.stemH);
    el.style.setProperty('--head-top', f.headTop);
    el.style.setProperty('--z', f.z);
    el.style.setProperty('--delay', f.delay);

    const stem = document.createElement('div');
    stem.className = 'stem';
    el.appendChild(stem);

    f.leaves.forEach(lf => {
      const leaf = document.createElement('div');
      leaf.className = `leaf ${lf.side}`;
      leaf.style.top = lf.top;
      leaf.style.setProperty('--s', lf.s);
      leaf.style.setProperty('--rot', `${lf.rot}deg`);
      leaf.style.setProperty('--ld', lf.ld);
      el.appendChild(leaf);
    });

    const head = document.createElement('div');
    head.className = 'head';

    const bud = document.createElement('div');
    bud.className = 'bud';
    head.appendChild(bud);

    head.appendChild(makePetals('outer', 12));
    head.appendChild(makePetals('mid', 10));
    head.appendChild(makePetals('inner', 8));

    const center = document.createElement('div');
    center.className = 'center';
    head.appendChild(center);

    el.appendChild(head);
    bouquet.appendChild(el);
  });

  // 3. Bilateral wreath: grows from bottom (180deg) along both left (-step) and right (+step) sides to meet at top (0deg)
  const wreath = document.getElementById('wreath');
  const halfSteps = 12; // 12 steps up each side = 24 nodes total, meeting at top (0deg)

  for (let s = 0; s <= halfSteps; s++) {
    const t = s / halfSteps; // 0 at bottom ground, 1 at top crown
    const stepDeg = (180 / halfSteps) * s;
    const progressDelay = 0.3 + t * 4.2;

    // Right side goes 180deg -> 360deg (0deg); Left side goes 180deg -> 0deg
    const angles = s === 0
      ? [180]
      : s === halfSteps
        ? [0]
        : [(180 + stepDeg) % 360, (180 - stepDeg + 360) % 360];

    angles.forEach((angle, sideIdx) => {
      const node = document.createElement('div');
      node.className = 'w-node';
      node.style.setProperty('--a', `${angle}deg`);

      const outerLeaf = document.createElement('div');
      outerLeaf.className = 'w-leaf out';
      outerLeaf.style.setProperty('--wr', '-25deg');
      outerLeaf.style.setProperty('--ws', '0.92');
      outerLeaf.style.setProperty('--wd', `${(progressDelay + sideIdx * 0.04).toFixed(2)}s`);

      const innerLeaf = document.createElement('div');
      innerLeaf.className = 'w-leaf in';
      innerLeaf.style.setProperty('--wr', '-29deg');
      innerLeaf.style.setProperty('--ws', '0.78');
      innerLeaf.style.setProperty('--wd', `${(progressDelay + 0.16 + sideIdx * 0.04).toFixed(2)}s`);

      node.appendChild(outerLeaf);
      node.appendChild(innerLeaf);

      // Golden berry accent at bottom (s=0), sides (s=6), and meeting point at top (s=12)
      if (s % 6 === 0) {
        const berry = document.createElement('div');
        berry.className = 'w-berry';
        berry.style.setProperty('--bd', `${(progressDelay + 0.45).toFixed(2)}s`);
        node.appendChild(berry);
      }

      wreath.appendChild(node);
    });
  }
</script>
